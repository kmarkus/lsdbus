
image: gcc:bullseye

build:
  stage: build
  before_script:
  - apt update && apt -y install cmake liblua5.3-dev libsystemd-dev libmxml-dev 
  script:
    - mkdir build && cd build && cmake .. && make
  artifacts:
    untracked: true
    
# run tests using the binary built before
test:
  stage: test
  before_script:
    - apt update && apt -y install cmake lua5.3 libmxml1 libsystemd0 lua-unit
  script:
    - cd build && make install && cd ..
    - cd test && lua run.lua -v
  dependencies:
  - build